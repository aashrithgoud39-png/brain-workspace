# Render "Blueprint": lets you deploy by pointing Render at your GitHub repo.
services:
  - type: web
    name: brain-workspace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true      # Render creates a random secret for you
      - key: DATABASE_URL
        sync: false              # you paste your Neon connection string in the dashboard
